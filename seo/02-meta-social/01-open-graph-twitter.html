<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Open Graph y Twitter Cards</title>

  <!--
    TEMA: Social SEO / Rich previews
    ENTREVISTA: ¿Para qué sirven Open Graph y Twitter Cards?
    Controlan cómo se ve el link al compartir en redes sociales.
    No afectan ranking directo, pero mejoran CTR social → tráfico.
  -->

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Desarrollo Laravel + React | Mi Empresa">
  <meta property="og:description" content="APIs escalables y frontends modernos para tu negocio.">
  <meta property="og:url" content="https://miempresa.com/servicios">
  <meta property="og:image" content="https://miempresa.com/images/og-servicios.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="es_ES">
  <meta property="og:site_name" content="Mi Empresa">

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@miempresa">
  <meta name="twitter:title" content="Desarrollo Laravel + React">
  <meta name="twitter:description" content="APIs escalables y frontends modernos.">
  <meta name="twitter:image" content="https://miempresa.com/images/og-servicios.jpg">

  <!-- Artículos de blog -->

  <meta property="og:type" content="article">

  <meta property="article:author" content="Ana García">
  <meta property="article:section" content="Desarrollo Web">
  -->
</head>
<body>

</html>
