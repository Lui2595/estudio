<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    TEMA: Meta tags esenciales en <head>
    ENTREVISTA: ¿Cuáles son los meta tags mínimos para SEO?
  -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Título: 50-60 caracteres, único por página, keyword al inicio -->
  <title>Desarrollo Web Laravel y React | Mi Empresa</title>

  <!-- Meta description: 150-160 caracteres, CTA, no duplicar entre páginas -->
  <meta name="description" content="Agencia especializada en Laravel y React. Creamos APIs escalables y frontends modernos. Solicita una consulta gratuita hoy.">

  <!-- Canonical: evita contenido duplicado -->
  <link rel="canonical" href="https://miempresa.com/servicios/laravel-react">

  <!-- Robots por página (si necesitas noindex) -->
  <!-- <meta name="robots" content="noindex, nofollow"> -->

  <!-- Idioma y región -->
  <meta name="language" content="Spanish">
  <link rel="alternate" hreflang="es" href="https://miempresa.com/es/servicios">
  <link rel="alternate" hreflang="en" href="https://miempresa.com/en/services">
  <link rel="alternate" hreflang="x-default" href="https://miempresa.com/servicios">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Preconnect a dominios externos críticos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://www.google-analytics.com">
</head>
<body>
  <h1>Desarrollo Web con Laravel y React</h1>
  <p>Contenido principal de la página...</p>
</body>
</html>
